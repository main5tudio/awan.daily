<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pratigahara Core</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================
     A. GLOBAL VARIABLES & RESET
     ========================================= */
  :root {
    --header-bg: rgba(18, 18, 18, 0.85);
    --bg: #fcfcfc;
    --text-active: rgba(18, 18, 18, 0.85);
    --text-dim: rgba(0, 0, 0, 0.45);
    --nav-fade: rgba(0, 0, 0, 0.20);
    --nav-active: rgba(18, 18, 18, 0.85);
    --orange-med: #ff9800; 
    --bold-red: #ff0000;
    --accent-green: #2d9e6b;
    --donker: #0a1128;
    --border: #eeeeee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background-color: var(--bg); color: var(--text-active); overflow: hidden; height: 100vh; }
</style>
</head>
<body>

  <div id="app-core"></div>

  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script>
  // Handle Project dynamic additions
  function triggerProjectAdd(type, projId) {
    let proj = window.AppData.projects.find(p => p.id === projId);
    if(!proj) return;

    if(type === 'link') {
      openUniModal("ADD QUICK LINK", "", (title, url) => {
        if(title.trim() && url.trim()) {
          proj.links.push({ id: 'l'+Date.now(), name: title.trim(), url: url.trim() });
          window.saveSystem(); // Auto-save update trigger
          renderProjectWorkspace();
        }
      }, false, "Link Title...");
      document.getElementById('uni-input').placeholder = "URL (https://...)";
    }
    else if(type === 'kanban') {
      openUniModal("NEW TASK", "", (val) => {
        if(val.trim()) {
          proj.kanbans.push({ id: 'k'+Date.now(), text: val.trim(), status: 'todo' });
          window.saveSystem(); // Auto-save update trigger
          renderProjectWorkspace();
        }
      }, true, "Task description...");
    }
    else if(type === 'shop') {
      openUniModal("ADD SHOP LINK", "", (typeLabel, url) => {
        if(typeLabel.trim() && url.trim()) {
          proj.shops.push({ id: 's'+Date.now(), type: typeLabel.trim(), url: url.trim() });
          window.saveSystem(); // Auto-save update trigger
          renderProjectWorkspace();
        }
      }, false, "Type (e.g. Itch.io, GooglePlay)...");
      document.getElementById('uni-input').placeholder = "URL (https://...)";
    }
  }

  // Handle Cares Dynamic additions
  function triggerCaresAdd(type) {
    if(type === 'category') {
      openUniModal("NEW CATEGORY", "", (val) => {
        if(val.trim()) {
          window.AppData.cares.push({ id: 'cg'+Date.now(), title: (val.startsWith('>')?val:'>'+val), items: [] });
          window.saveSystem(); // Auto-save update trigger
          renderCaresDynamic();
        }
      }, true, "Category Name (e.g. >learning)");
    } else if (type === 'variable') {
      openUniModal("NEW VARIABLE", "", (varName, countStr) => {
        let catName = prompt("Add to which category? (e.g. >gaming)");
        if(!catName) return; 
        if(!catName.startsWith('>')) catName = '>' + catName;
        
        let cat = window.AppData.cares.find(c => c.title.toLowerCase() === catName.toLowerCase());
        if(!cat) {
          cat = { id: 'cg'+Date.now(), title: catName, items: [] };
          window.AppData.cares.push(cat);
        }
        let max = parseInt(countStr) || 1;
        cat.items.push({ id: 'c'+Date.now(), label: varName.trim(), max: max });
        window.saveSystem(); // Auto-save update trigger
        renderCaresDynamic();
      }, false, "Variable Name (e.g. tacticool)...");
      document.getElementById('uni-input').placeholder = "Max Limit Count (e.g. 2)";
    }
  }
  </script>
</body>
</html>
