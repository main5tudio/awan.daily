<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pratigahara Core v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. CSS - DESIGN SYSTEM & UI/UX
           ========================================= */
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #141417;
            --text-main: #e0e0e0;
            --text-dim: #808085;
            --accent: #ff9800; /* Orange Tactical */
            --accent-soft: rgba(255, 152, 0, 0.1);
            --danger: #ff4444;
            --success: #00c853;
            --border: #25252a;
            --radius: 12px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        .splash-logo {
            font-size: 4rem;
            color: var(--accent);
            animation: breathe 3s infinite ease-in-out;
            margin-bottom: 10px;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--accent)); }
        }
        .splash-text {
            font-weight: 800;
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* --- APP HEADER --- */
        header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .brand { font-weight: 800; font-size: 1rem; letter-spacing: 1px; color: var(--accent); }
        .timer-box { text-align: right; }
        #clock { display: block; font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; }
        #date { display: block; font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; margin-top: 2px; }

        /* --- MAIN CONTENT AREA --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            scrollbar-width: none;
        }
        main::-webkit-scrollbar { display: none; }

        .view { display: none; animation: slideUp 0.3s ease-out; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI COMPONENTS --- */
        .section-title {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 25px 0 12px;
            display: flex;
            justify-content: space-between;
        }
        .section-title:first-child { margin-top: 0; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        /* Calendar Mini */
        .cal-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day-head { font-size: 0.6rem; color: var(--text-dim); text-align: center; font-weight: 800; padding-bottom: 5px;}
        .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-radius: 6px; color: var(--text-dim); }
        .cal-cell.today { background: var(--accent); color: var(--bg-dark); font-weight: 800; }
        .cal-cell.has-data { color: var(--text-main); font-weight: 600; border: 1px solid var(--border); }

        /* Tactical List */
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .log-item:last-child { border-bottom: none; }
        .log-tag { font-family: var(--font-mono); font-size: 0.7rem; padding: 2px 6px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; margin-right: 10px;}
        .log-time { font-size: 0.7rem; color: var(--text-dim); }

        /* Action Grids (Cares) */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
        }
        .action-square {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-square.done {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-dark);
        }
        .action-label { font-size: 0.65rem; font-weight: 800; margin-top: 5px; text-align: center; }

        /* --- NAVIGATION --- */
        nav {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            height: 70px;
            display: flex;
            padding: 0 10px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-item.active { color: var(--accent); }
        .nav-dot { width: 4px; height: 4px; background: transparent; border-radius: 50%; margin-top: 4px; }
        .nav-item.active .nav-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

        /* Input Styles */
        input, select, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: inherit;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-logo">⬢</div>
        <div class="splash-text">CORE TERMINAL</div>
    </div>

    <header>
        <div class="brand">PRATIGAHARA</div>
        <div class="timer-box">
            <span id="clock">00:00:00</span>
            <span id="date">MINGGU, 03 MEI 2026</span>
        </div>
    </header>

    <main id="main-scroll">
        
        <div id="view-home" class="view active">
            <div class="section-title"><span>Tactical Calendar</span></div>
            <div class="card">
                <div id="calendar-grid" class="cal-container">
                    </div>
            </div>

            <div class="section-title"><span>System Log (own.self)</span> <span id="log-count">0</span></div>
            <div class="card" id="log-container">
                <div class="log-item" style="color: var(--text-dim); justify-content: center;">No data recorded today.</div>
            </div>
        </div>

        <div id="view-project" class="view">
            <div class="section-title"><span>Active Project</span></div>
            <div class="card">
                <input type="text" id="project-name" placeholder="Project Title..." data-save="current_proj">
                <textarea id="project-note" placeholder="Quick notes for session..." data-save="current_note" rows="4"></textarea>
                <div class="section-title"><span>Milestone Progress</span></div>
                <div class="action-grid" id="milestone-grid">
                    </div>
            </div>
        </div>

        <div id="view-cares" class="view">
            <div class="section-title"><span>Spiritual Check</span></div>
            <div class="action-grid" id="shalah-grid">
                </div>

            <div class="section-title"><span>Hydration & Body</span></div>
            <div class="action-grid" id="water-grid" style="margin-bottom: 20px;">
                </div>
            
            <div class="card">
                <div style="font-size: 0.8rem; margin-bottom: 10px;">Body Remedy Status</div>
                <div style="display: flex; gap: 10px;">
                    <div class="action-square" id="rem-1" onclick="toggleSimple('rem-1', 'Remedy AM')">AM</div>
                    <div class="action-square" id="rem-2" onclick="toggleSimple('rem-2', 'Remedy PM')">PM</div>
                </div>
            </div>
        </div>

        <div id="view-daily" class="view">
            <div class="section-title"><span>Inventory Check</span></div>
            <div class="card">
                <div class="log-item">
                    <span>Beras & Sembako</span>
                    <select style="width: 100px; margin:0;" data-save="stok_beras">
                        <option>Aman</option>
                        <option>Menipis</option>
                        <option>Habis</option>
                    </select>
                </div>
                <div class="log-item">
                    <span>Token Listrik</span>
                    <input type="number" placeholder="Nominal..." style="width: 100px; margin:0;" data-save="token_val">
                </div>
            </div>
        </div>

    </main>

    <nav>
        <div class="nav-item active" onclick="navTo('home', this)">
            <span>Home</span><div class="nav-dot"></div>
        </div>
        <div class="nav-item" onclick="navTo('project', this)">
            <span>Project</span><div class="nav-dot"></div>
        </div>
        <div class="nav-item" onclick="navTo('cares', this)">
            <span>Cares</span><div class="nav-dot"></div>
        </div>
        <div class="nav-item" onclick="navTo('daily', this)">
            <span>Daily</span><div class="nav-dot"></div>
        </div>
    </nav>

    <script>
        /* =========================================
           2. JAVASCRIPT - CORE ENGINE & PERSISTENCE
           ========================================= */

        const DB_KEY = "PRATIGAHARA_LOCAL_DB";
        
        // 1. Initial Database (own.self logic)
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            profile: { name: "Commrade" },
            logs: [],
            state: {} // Persistent input values
        };

        // 2. DOM Elements
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        const splash = document.getElementById('splash');

        // 3. Booting System
        window.addEventListener('DOMContentLoaded', () => {
            initClock();
            renderCalendar();
            renderCares();
            renderMilestones();
            loadPersistentState();
            refreshLogs();

            // Splash timeout
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 600);
            }, 2500);
        });

        // 4. Persistence (Save/Load)
        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function loadPersistentState() {
            // Mengisi kembali input-input yang punya atribut data-save
            document.querySelectorAll('[data-save]').forEach(el => {
                const key = el.getAttribute('data-save');
                if (db.state[key]) el.value = db.state[key];
                
                // Tambahkan event listener untuk auto-save saat ngetik
                el.addEventListener('input', (e) => {
                    db.state[key] = e.target.value;
                    saveDB();
                });
            });
        }

        function pushLog(type, msg) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
            
            db.logs.unshift({
                id: Date.now(),
                timestamp: timeStr,
                type: type,
                text: msg
            });

            // Simpan hanya 50 log terakhir agar Samsung A10 tidak lag
            if(db.logs.length > 50) db.logs.pop();
            
            saveDB();
            refreshLogs();
        }

        // 5. UI Renderers
        function refreshLogs() {
            const container = document.getElementById('log-container');
            const countEl = document.getElementById('log-count');
            countEl.innerText = db.logs.length;

            if (db.logs.length === 0) {
                container.innerHTML = `<div class="log-item" style="color:var(--text-dim); justify-content:center;">No data recorded.</div>`;
                return;
            }

            container.innerHTML = db.logs.slice(0, 10).map(item => `
                <div class="log-item">
                    <div><span class="log-tag">${item.type}</span><span>${item.text}</span></div>
                    <span class="log-time">${item.timestamp}</span>
                </div>
            `).join('');
        }

        function renderCares() {
            // Shalah
            const sGrid = document.getElementById('shalah-grid');
            ["SUBH", "DZUH", "ASHR", "MAGH", "ISYA"].forEach(s => {
                const box = document.createElement('div');
                box.className = 'action-square';
                box.innerHTML = `<div class="action-label">${s}</div>`;
                box.onclick = () => {
                    box.classList.toggle('done');
                    if(box.classList.contains('done')) pushLog("SHALAH", s + " Completed");
                };
                sGrid.appendChild(box);
            });

            // Water
            const wGrid = document.getElementById('water-grid');
            for(let i=1; i<=8; i++) {
                const box = document.createElement('div');
                box.className = 'action-square';
                box.innerHTML = `<div class="action-label">${i}</div>`;
                box.onclick = () => {
                    box.classList.toggle('done');
                    if(box.classList.contains('done')) pushLog("WATER", "Glass " + i);
                };
                wGrid.appendChild(box);
            }
        }

        function renderMilestones() {
            const mGrid = document.getElementById('milestone-grid');
            ["I", "II", "III", "IV", "V"].forEach(m => {
                const box = document.createElement('div');
                box.className = 'action-square';
                box.innerHTML = `<div class="action-label">STG ${m}</div>`;
                box.onclick = () => {
                    box.classList.toggle('done');
                    pushLog("PROJ", "Milestone " + m + " toggled");
                };
                mGrid.appendChild(box);
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const today = now.getDate();

            grid.innerHTML = '';
            ['M','S','S','R','K','J','S'].forEach(d => {
                grid.innerHTML += `<div class="cal-day-head">${d}</div>`;
            });

            for(let i=1; i<=daysInMonth; i++) {
                const isToday = i === today ? 'today' : '';
                grid.innerHTML += `<div class="cal-cell ${isToday}">${i}</div>`;
            }
        }

        // 6. Navigation Logic
        function navTo(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('view-' + viewId).classList.add('active');
            el.classList.add('active');
            
            // Scroll back to top
            document.getElementById('main-scroll').scrollTop = 0;
        }

        // 7. Utilities
        function initClock() {
            setInterval(() => {
                const n = new Date();
                clockEl.innerText = n.toLocaleTimeString('en-GB'); // Format HH:mm:ss
            }, 1000);

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.innerText = new Date().toLocaleDateString('id-ID', options).toUpperCase();
        }

        function toggleSimple(id, label) {
            const el = document.getElementById(id);
            el.classList.toggle('done');
            if(el.classList.contains('done')) pushLog("BODY", label + " Done");
        }

    </script>
</body>
</html>
